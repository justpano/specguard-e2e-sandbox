name: SpecGuard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    # Fork PRs cannot receive repository secrets. Never change this to pull_request_target.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted base-branch action only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/specguard
      - name: Analyze specification drift
        uses: ./.github/actions/specguard
        with:
          endpoint: ${{ secrets.SPECGUARD_ENDPOINT }}
          secret: ${{ secrets.SPECGUARD_SECRET }}
          github-token: ${{ github.token }}
